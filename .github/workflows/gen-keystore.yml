name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "密钥别名"
        required: true
        default: "release"
      key_password:
        description: "密钥密码（≥6 位）"
        required: true
      store_password:
        description: "Keystore 密码（≥6 位）"
        required: true
      dname:
        description: "DN，如 CN=MyApp,O=MyOrg,C=CN"
        required: true
        default: "CN=MyApp,O=MyOrg,C=CN"

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.store_password }}" \
            -dname "${{ inputs.dname }}" \
            -noprompt

      - name: Output base64
        run: |
          echo "======== KEYSTORE_BASE64 START ========"
          base64 -w0 release.keystore
          echo ""
          echo "======== KEYSTORE_BASE64 END ========"
          echo ""
          echo "KEY_ALIAS      : ${{ inputs.key_alias }}"
          echo "KEY_PASSWORD   : ${{ inputs.key_password }}"
          echo "STORE_PASSWORD : ${{ inputs.store_password }}"
